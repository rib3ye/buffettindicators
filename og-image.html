<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #06070D;
    overflow: hidden;
    position: relative;
  }

  /* Dot grid texture */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #1E2030 1px, transparent 1px);
    background-size: 36px 36px;
    opacity: 0.35;
  }

  /* Subtle gradient wash */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 25% 50%, rgba(200, 144, 42, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 30%, rgba(65, 146, 242, 0.04) 0%, transparent 60%);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9895A4;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #27B87A;
    box-shadow: 0 0 12px #27B87A;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 96px;
    font-weight: 600;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: #EAE5DA;
  }

  h1 em {
    font-style: italic;
    color: #C8902A;
  }

  .rule {
    width: 52px;
    height: 2px;
    background: #C8902A;
    opacity: 0.7;
    margin-top: 4px;
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #9895A4;
    letter-spacing: 0.02em;
    line-height: 1.6;
    max-width: 600px;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .indicators {
    display: flex;
    gap: 8px;
  }

  .indicator-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #6A6878;
    padding: 8px 18px;
    border: 1px solid #222638;
    background: rgba(10, 12, 20, 0.7);
  }

  .indicator-pill.active {
    color: #C8902A;
    border-color: rgba(200, 144, 42, 0.3);
    background: rgba(200, 144, 42, 0.06);
  }

  .domain {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #6A6878;
  }

  /* Decorative section numbers */
  .ghost-numbers {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0;
    z-index: 0;
  }

  .ghost-num {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 88px;
    font-weight: 600;
    line-height: 0.95;
    color: #222638;
    letter-spacing: -0.04em;
    user-select: none;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="ghost-numbers">
    <span class="ghost-num">01</span>
    <span class="ghost-num">02</span>
    <span class="ghost-num">03</span>
    <span class="ghost-num">04</span>
  </div>

  <div class="container">
    <div class="top">
      <div class="eyebrow">
        <span class="dot"></span>
        Live Market Valuation Data
      </div>
      <div>
        <h1>What Would<br><em>Buffett Do?</em></h1>
        <div class="rule"></div>
      </div>
      <p class="subtitle">Four independent gauges of US market valuation — updated continuously from primary sources.</p>
    </div>

    <div class="bottom">
      <div class="indicators">
        <span class="indicator-pill active">Buffett Indicator</span>
        <span class="indicator-pill">Shiller CAPE</span>
        <span class="indicator-pill">Fed Model</span>
        <span class="indicator-pill">Corp. Profits</span>
      </div>
      <span class="domain">buffettindicators.com</span>
    </div>
  </div>
</body>
</html>
